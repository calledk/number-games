<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spilleportal</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #2c3e50;
            font-family: 'Arial', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            color: white; touch-action: none; user-select: none;
        }
        h1 { margin-top: 50px; font-size: clamp(24px, 6vw, 40px); text-shadow: 2px 2px 4px #000; }
        .menu-container {
            display: flex; flex-direction: column; gap: 20px; margin-top: 30px; width: 90%; max-width: 500px;
        }
        .game-card {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-radius: 15px; padding: 30px; text-align: center;
            text-decoration: none; color: white; font-size: 24px; font-weight: bold;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3); border: 4px solid white;
            transition: transform 0.1s;
        }
        .game-card:active { transform: scale(0.95); }
        .game-card.sonic { background: linear-gradient(135deg, #3498db, #2980b9); }
        
        .icon { font-size: 40px; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

    <h1>Vælg dit spil!</h1>

    <div class="menu-container">
        <!-- Linker til dit mario spil -->
        <a href="mario.html" class="game-card">
            <span class="icon">🍄</span>
            Matematik Kongeriget
            <div style="font-size: 14px; font-weight: normal; margin-top: 10px;">Lær at regne og find tallene</div>
        </a>

        <!-- Linker til det nye sonic spil -->
        <a href="sonic.html" class="game-card sonic">
            <span class="icon">🦔</span>
            Det Blå Lyn - Talmønstre
            <div style="font-size: 14px; font-weight: normal; margin-top: 10px;">Lær hvordan tallene bygger sig op til 100</div>
        </a>
    </div>

</body>
</html>
