<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Det Blå Lyn</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #1E90FF; font-family: 'Arial', sans-serif;
            overflow: hidden; display: flex; flex-direction: column; align-items: center;
            touch-action: none; user-select: none;
        }
        #topBar {
            width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; box-sizing: border-box; color: white;
        }
        .back-btn {
            background: #e74c3c; color: white; text-decoration: none; padding: 5px 15px;
            border-radius: 8px; font-weight: bold; border: 2px solid white; font-size: 14px;
        }
        .scoreboard { display: flex; align-items: center; background: rgba(0,0,0,0.6); padding: 5px 20px; border-radius: 15px; border: 3px solid white;}
        .score-title { font-size: 16px; margin-right: 15px; font-weight: bold; }
        
        .score-number { font-size: 40px; font-weight: bold; letter-spacing: 2px;}
        .score-number span { display: inline-block; } 
        
        .tens-color { color: #FFEA00; text-shadow: 0 0 12px #FF8C00, 2px 2px 0 #000; }
        .ones-color { color: #FF3333; text-shadow: 2px 2px 0 #000; }
        
        @keyframes popGlow {
            0% { transform: scale(1); }
            40% { transform: scale(1.8) translateY(-5px); color: #FFFFFF; text-shadow: 0 0 25px #FF4500, 0 0 45px #FFEA00, 4px 4px 0 #000; }
            100% { transform: scale(1); }
        }
        .pop-animation { animation: popGlow 1.5s ease-out; }

        .settings-bar {
            width: 100%; max-width: 800px; display: flex; justify-content: flex-end; padding: 0 20px; box-sizing: border-box; gap: 10px; margin-top: -5px;
        }
        .setting-select {
            background-color: #5C94FC; color: white; border: 2px solid white; border-radius: 5px; padding: 2px 5px; font-weight: bold; cursor: pointer; font-size: 14px;
        }

        #gameCanvas {
            background-color: #87CEEB; box-shadow: 0 0 15px rgba(0,0,0,0.5); border-radius: 10px;
            width: 100%; max-width: 800px; max-height: 60vh; object-fit: contain; margin-top: 5px;
        }
        #instruction { color: white; margin-top: 10px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="topBar">
        <a href="index.html" class="back-btn">⬅ Tilbage</a>
        <div class="scoreboard">
            <div class="score-title">Dit tal:</div>
            <div class="score-number">
                <span id="tensDisplay" class="tens-color">0</span><span id="onesDisplay" class="ones-color">0</span>
            </div>
        </div>
    </div>
    
    <div class="settings-bar">
        <label style="color: white; font-weight: bold; font-size: 14px;">Robotter & Fart:</label>
        <select id="difficultySelect" class="setting-select">
            <option value="Let">Let</option>
            <option value="Mellem" selected>Mellem</option>
            <option value="Svær">Svær</option>
        </select>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="instruction">Hop over robotterne og saml tallene fra 0 til 9!</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'PLAYING'; 
        let currentTens = 0;   
        let currentOnes = 0;   
        let nextRingValue = 0; 
        
        let highestRevealedTen = 0; 
        let sonicHasAura = false;
        let loopVisible = false;
        
        let baseSpeed = 6;
        let gameSpeed = 6;
        let bgOffset = 0;
        let showMessage = false;
        let messageTimer = 0;
        
        let obstacleChance = 0.4;
        
        let fireworks = [];
        
        document.getElementById('difficultySelect').addEventListener('change', function(e) {
            let val = e.target.value;
            if (val === 'Let') { obstacleChance = 0.2; baseSpeed = 4; }
            else if (val === 'Mellem') { obstacleChance = 0.4; baseSpeed = 6; }
            else if (val === 'Svær') { obstacleChance = 0.75; baseSpeed = 10; } 
            
            if (gameState === 'PLAYING') {
                gameSpeed = baseSpeed;
            }
        });

        const player = {
            x: 150, y: 300, size: 40, 
            dy: 0, gravity: 0.8, jumpPower: -15, isJumping: false,
            spinAngle: 0, isHurt: false, hurtTimer: 0
        };

        const tails = { x: 850, y: -50, targetX: 0, targetY: 0 };
        const bigRing = { x: 0, y: 0, active: false, value: 0, animatingToUI: false, ringScale: 1, textScale: 1, ringAlpha: 1 };
        const loopObj = { phase: 1, angle: Math.PI / 2 }; 

        let objects = []; 
        let spawnTimer = 0;
        let lastSpawnWasObstacle = false;

        const obstacleTypes = ['spikes', 'motobug', 'mech', 'bee', 'drone'];

        function createFirework(x, y) {
            let colors = ['#FF1493', '#00FFFF', '#FFEA00', '#32CD32', '#FF4500'];
            let color = colors[Math.floor(Math.random() * colors.length)];
            for(let i=0; i<40; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 5 + 1;
                fireworks.push({
                    x: x, y: y,
                    vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
                    life: 1.0, color: color
                });
            }
        }

        function updateAndDrawFireworks() {
            for(let i = fireworks.length-1; i>=0; i--) {
                let p = fireworks[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.05; 
                p.life -= 0.015;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1.0;
                if (p.life <= 0) fireworks.splice(i, 1);
            }
        }

        function triggerTailsTransition() {
            gameState = 'TAILS_IN';
            objects = []; 
            tails.x = 850; tails.y = -50;
            tails.targetX = player.x; tails.targetY = player.y - 120;
            
            bigRing.active = true; 
            bigRing.animatingToUI = false;
            bigRing.ringScale = 1.0; 
            bigRing.textScale = 1.0; 
            bigRing.ringAlpha = 1.0;
            bigRing.value = (currentTens + 1) * 10; 
            bigRing.x = tails.x; bigRing.y = tails.y + 35;
        }

        function drawMathRings() {
            ctx.save();
            
            // ---------------------------------------------------------
            // 1. TIDS-LINJEN I TOPPEN (10 til 100 slots) - ENDNU STØRRE
            // ---------------------------------------------------------
            let startX = 50; 
            let startY = 40; 
            let ringRadius = 28; // Større ringe
            let xSpacing = 76; // Justeret plads for at de fylder pænt
            
            for (let i = 0; i < 10; i++) {
                let colX = startX + (i * xSpacing);
                
                if (i < highestRevealedTen) {
                    // Aktiv Guldfarvet
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = 'gold';
                    ctx.beginPath(); ctx.arc(colX, startY, ringRadius, 0, Math.PI*2); ctx.stroke();
                    ctx.strokeStyle = '#DAA520'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(colX, startY, ringRadius - 4, 0, Math.PI*2); ctx.stroke();
                    
                    ctx.fillStyle = '#FFEA00';
                    ctx.shadowColor = '#FF8C00'; ctx.shadowBlur = 5;
                    ctx.font = 'bold 22px Arial'; // Større skrift
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText((i + 1) * 10, colX, startY);
                    ctx.shadowBlur = 0; 
                } else {
                    // Inaktiv (Grå)
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = 'rgba(150, 150, 150, 0.5)';
                    ctx.beginPath(); ctx.arc(colX, startY, ringRadius, 0, Math.PI*2); ctx.stroke();
                    ctx.strokeStyle = 'rgba(100, 100, 100, 0.5)'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(colX, startY, ringRadius - 4, 0, Math.PI*2); ctx.stroke();
                    
                    // MØRKERE TEKST SÅ DEN ER NEM AT LÆSE
                    ctx.fillStyle = 'rgba(80, 80, 80, 0.9)';
                    ctx.font = 'bold 22px Arial'; // Større skrift
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText((i + 1) * 10, colX, startY);
                }
            }
            
            // ---------------------------------------------------------
            // 2. DEN FASTE BOKS TIL RØDE RINGE (Venstre side) - MERE LUFT
            // ---------------------------------------------------------
            let boxX = 15;
            let boxY = 95; 
            let boxW = 36;
            let boxH = 180; // Højere boks, så der er masser af luft
            let radius = 8;
            
            // Overskrift
            ctx.fillStyle = 'white';
            ctx.font = 'bold 18px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("1'ere", boxX + boxW/2, boxY - 10);

            // Boks baggrund
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(boxX + radius, boxY);
            ctx.lineTo(boxX + boxW - radius, boxY);
            ctx.arcTo(boxX + boxW, boxY, boxX + boxW, boxY + radius, radius);
            ctx.lineTo(boxX + boxW, boxY + boxH - radius);
            ctx.arcTo(boxX + boxW, boxY + boxH, boxX + boxW - radius, boxY + boxH, radius);
            ctx.lineTo(boxX + radius, boxY + boxH);
            ctx.arcTo(boxX, boxY + boxH, boxX, boxY + boxH - radius, radius);
            ctx.lineTo(boxX, boxY + radius);
            ctx.arcTo(boxX, boxY, boxX + radius, boxY, radius);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Røde ringe med MERE AFSTAND
            let onesRadius = 6;
            let onesSpacing = 18; // Stor luft imellem ringene!
            let bottomY = boxY + boxH - 16; // Bund-margen

            for (let j = 0; j < currentOnes; j++) {
                let rY = bottomY - (j * onesSpacing);
                let rX = boxX + boxW / 2;
                
                if (j === 0) {
                    ctx.shadowColor = '#FFEA00';
                    ctx.shadowBlur = 10 + Math.sin(Date.now() / 150) * 5;
                } else {
                    ctx.shadowBlur = 0;
                }

                ctx.strokeStyle = '#FF3333'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(rX, rY, onesRadius, 0, Math.PI*2); ctx.stroke();
                
                ctx.shadowBlur = 0; 
                ctx.strokeStyle = '#8B0000'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.arc(rX, rY, onesRadius - 1.5, 0, Math.PI*2); ctx.stroke();
            }
            ctx.restore();
        }

        function drawPlayer() {
            if (player.isHurt && Math.floor(Date.now() / 100) % 2 === 0) return;

            ctx.save();
            ctx.translate(player.x, player.y - 10); 
            
            if (sonicHasAura) {
                ctx.shadowColor = '#FFEA00';
                ctx.shadowBlur = 20 + Math.sin(Date.now() / 50) * 15;
                ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255, 234, 0, 0.4)'; ctx.fill();
                ctx.shadowBlur = 0;
            }

            if (gameState === 'SONIC_CHEER') {
                ctx.fillStyle = '#1E90FF'; ctx.beginPath(); ctx.arc(0, 5, 14, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#FFCC99'; ctx.beginPath(); ctx.arc(0, 7, 9, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = '#1E90FF'; ctx.beginPath(); ctx.arc(0, -10, 16, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#FFCC99'; ctx.beginPath(); ctx.ellipse(4, -5, 10, 7, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(12, -7, 3, 0, Math.PI*2); ctx.fill();

                ctx.fillStyle = 'white'; ctx.beginPath(); ctx.ellipse(0, -14, 5, 7, Math.PI/8, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(8, -14, 5, 7, -Math.PI/8, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#32CD32'; ctx.beginPath(); ctx.arc(3, -13, 2.5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(11, -13, 2.5, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(3, -13, 1, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(11, -13, 1, 0, Math.PI*2); ctx.fill();

                ctx.fillStyle = '#0000CD';
                ctx.beginPath(); ctx.moveTo(-10, -20); ctx.lineTo(-25, -15); ctx.lineTo(-12, -5); ctx.fill();
                ctx.beginPath(); ctx.moveTo(-12, -5); ctx.lineTo(-30, 5); ctx.lineTo(-12, 10); ctx.fill();
                ctx.beginPath(); ctx.moveTo(-10, 10); ctx.lineTo(-20, 20); ctx.lineTo(0, 15); ctx.fill();

                ctx.strokeStyle = '#1E90FF'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(-8, 5); ctx.lineTo(-20, -15); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(8, 5); ctx.lineTo(20, -15); ctx.stroke();
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(-20, -15, 6, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(20, -15, 6, 0, Math.PI*2); ctx.fill();

                ctx.strokeStyle = '#1E90FF'; ctx.lineWidth = 4;
                if (player.y < 300) {
                    ctx.beginPath(); ctx.moveTo(-5, 15); ctx.lineTo(-12, 15); ctx.lineTo(-12, 22); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(5, 15); ctx.lineTo(12, 15); ctx.lineTo(12, 22); ctx.stroke();
                    ctx.fillStyle = 'red';
                    ctx.beginPath(); ctx.ellipse(-12, 25, 10, 5, 0, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(12, 25, 10, 5, 0, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.beginPath(); ctx.moveTo(-5, 15); ctx.lineTo(-5, 25); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(5, 15); ctx.lineTo(5, 25); ctx.stroke();
                    ctx.fillStyle = 'red';
                    ctx.beginPath(); ctx.ellipse(-2, 28, 10, 5, 0, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(8, 28, 10, 5, 0, 0, Math.PI*2); ctx.fill();
                }
                
                ctx.restore();
                return;
            }

            if (player.isJumping || gameState === 'SONIC_LOOP') {
                player.spinAngle += 0.6; ctx.rotate(player.spinAngle);
                ctx.fillStyle = '#1E90FF'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#0000CD'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI); ctx.stroke();
                ctx.beginPath(); ctx.arc(0, 0, 8, Math.PI, Math.PI*2); ctx.stroke();
                ctx.restore(); return; 
            }

            let runTime = Date.now() / 60;
            let foot1X = Math.cos(runTime) * 15; let foot1Y = Math.sin(runTime) * 10;
            let foot2X = Math.cos(runTime + Math.PI) * 15; let foot2Y = Math.sin(runTime + Math.PI) * 10;

            ctx.strokeStyle = '#1E90FF'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(foot1X, 20 + foot1Y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(foot2X, 20 + foot2Y); ctx.stroke();

            ctx.fillStyle = 'red'; ctx.beginPath(); ctx.ellipse(foot1X + 4, 25 + foot1Y, 12, 6, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(foot2X + 4, 25 + foot2Y, 12, 6, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'white'; ctx.fillRect(foot1X + 2, 22 + foot1Y, 4, 6); ctx.fillRect(foot2X + 2, 22 + foot2Y, 4, 6);
            ctx.fillStyle = '#0000CD'; ctx.beginPath(); ctx.moveTo(-10, -15); ctx.lineTo(-30, -10); ctx.lineTo(-15, -5); ctx.fill(); ctx.beginPath(); ctx.moveTo(-15, -5); ctx.lineTo(-35, 5); ctx.lineTo(-15, 10); ctx.fill(); ctx.beginPath(); ctx.moveTo(-10, 10); ctx.lineTo(-25, 20); ctx.lineTo(0, 15); ctx.fill();

            ctx.fillStyle = '#1E90FF'; ctx.beginPath(); ctx.arc(0, 5, 14, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#FFCC99'; ctx.beginPath(); ctx.arc(4, 7, 9, 0, Math.PI * 2); ctx.fill(); 
            ctx.fillStyle = '#1E90FF'; ctx.beginPath(); ctx.arc(2, -10, 16, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#FFCC99'; ctx.beginPath(); ctx.ellipse(12, -5, 10, 7, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(20, -7, 3, 0, Math.PI*2); ctx.fill(); 

            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.ellipse(6, -14, 5, 7, Math.PI/8, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(14, -14, 5, 7, -Math.PI/8, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#32CD32'; ctx.beginPath(); ctx.arc(9, -13, 2.5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(17, -13, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(9, -13, 1, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(17, -13, 1, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#1E90FF'; ctx.beginPath(); ctx.moveTo(-5, -22); ctx.lineTo(-1, -32); ctx.lineTo(5, -25); ctx.fill(); ctx.beginPath(); ctx.moveTo(5, -25); ctx.lineTo(10, -34); ctx.lineTo(13, -22); ctx.fill();
            ctx.fillStyle = '#FFCC99'; ctx.beginPath(); ctx.moveTo(5, -25); ctx.lineTo(10, -31); ctx.lineTo(11, -23); ctx.fill();
            ctx.restore();
        }

        function drawTails() {
            if (gameState === 'PLAYING') return;
            
            let hoverOffset = Math.sin(Date.now() / 150) * 5;
            ctx.save(); ctx.translate(tails.x, tails.y + hoverOffset);
            
            let rotorSpin = Date.now() / 20; 
            ctx.save(); ctx.translate(0, -18); 
            
            ctx.fillStyle = 'rgba(255, 165, 0, 0.4)'; 
            ctx.beginPath(); ctx.ellipse(0, 0, 25, 4, 0, 0, Math.PI*2); ctx.fill();

            let tailX = Math.cos(rotorSpin) * 25;
            let tailY = Math.sin(rotorSpin) * 4;
            
            ctx.fillStyle = '#FFA500'; 
            ctx.beginPath(); ctx.ellipse(tailX, tailY, 12, 3, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(-tailX, -tailY, 12, 3, 0, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(tailX + (tailX>0?6:-6), tailY, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(-tailX + (-tailX>0?6:-6), -tailY, 3, 0, Math.PI*2); ctx.fill();
            ctx.restore();

            ctx.fillStyle = '#FFA500'; ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill(); 
            ctx.beginPath(); ctx.arc(-6, -8, 10, 0, Math.PI*2); ctx.fill(); 
            ctx.beginPath(); ctx.moveTo(-12, -15); ctx.lineTo(-16, -25); ctx.lineTo(-4, -17); ctx.fill(); ctx.beginPath(); ctx.moveTo(-2, -16); ctx.lineTo(4, -25); ctx.lineTo(4, -14); ctx.fill();
            
            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(-12, -6, 5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(0, 2, 7, 0, Math.PI*2); ctx.fill(); 
            ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(-16, -8, 2, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(-8, -10, 2, 0, Math.PI*2); ctx.fill(); 
            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(-8, 15, 4, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(8, 15, 4, 0, Math.PI*2); ctx.fill();

            let legSwing = Math.sin(Date.now() / 200) * 3;
            ctx.fillStyle = 'red';
            ctx.beginPath(); ctx.ellipse(-4 + legSwing, 22, 6, 3, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(4 + legSwing, 22, 6, 3, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'white';
            ctx.fillRect(-6 + legSwing, 21, 2, 3);
            ctx.fillRect(2 + legSwing, 21, 2, 3);

            ctx.restore();
        }

        function drawBigRing() {
            if (!bigRing.active) return;
            ctx.save();
            
            let rx = bigRing.x; 
            let ry = bigRing.y; 
            let rScale = bigRing.ringScale;
            let tScale = bigRing.textScale;
            
            if (gameState === 'TAILS_IN') {
                ry += Math.sin(Date.now() / 150) * 5;
            }
            
            if (bigRing.ringAlpha > 0) {
                ctx.globalAlpha = bigRing.ringAlpha;
                ctx.strokeStyle = 'gold'; ctx.lineWidth = 10 * rScale; 
                ctx.beginPath(); ctx.arc(rx, ry, 35 * rScale, 0, Math.PI*2); ctx.stroke();
                ctx.strokeStyle = '#DAA520'; ctx.lineWidth = 3 * rScale; 
                ctx.beginPath(); ctx.arc(rx, ry, 30 * rScale, 0, Math.PI*2); ctx.stroke();
            }
            
            ctx.globalAlpha = 1.0;
            ctx.fillStyle = '#FFEA00';
            
            if (bigRing.animatingToUI) {
                ctx.shadowColor = '#FF8C00'; ctx.shadowBlur = 5;
            }
            
            ctx.font = `bold ${30 * tScale}px Arial`; 
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(bigRing.value, rx, ry);
            
            ctx.restore();
        }

        function drawLoop() {
            if (!loopVisible) return;
            ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 20; ctx.beginPath(); ctx.arc(400, 200, 100, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeStyle = '#32CD32'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(400, 200, 90, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = '#8B4513'; ctx.fillRect(385, 295, 30, 45); 
        }

        function drawBackground() {
            bgOffset -= gameSpeed;
            if (bgOffset <= -80) bgOffset += 80; 

            ctx.fillStyle = '#8B4513'; ctx.fillRect(0, 340, canvas.width, 60);
            for (let i = -1; i <= canvas.width / 40 + 2; i++) {
                ctx.fillStyle = (Math.abs(i) % 2 === 0) ? '#32CD32' : '#228B22'; 
                ctx.fillRect((i * 40) + bgOffset, 320, 40, 20);
            }

            // Baggrundstekst i midten er slettet for at give et renere look!

            drawLoop(); 
            drawMathRings(); 
        }

        function drawObstacle(obj) {
            let cx = obj.x; let cy = obj.y; let w = obj.width; let h = obj.height;
            ctx.save();
            
            if (obj.type === 'spikes') {
                ctx.fillStyle = '#C0C0C0'; ctx.strokeStyle = '#808080'; ctx.lineWidth = 2;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath(); ctx.moveTo(cx + (i * 13), cy + h); ctx.lineTo(cx + 6 + (i * 13), cy); ctx.lineTo(cx + 13 + (i * 13), cy + h);
                    ctx.fill(); ctx.stroke();
                }
            } 
            else if (obj.type === 'motobug') {
                ctx.fillStyle = '#1E3F66'; ctx.beginPath(); ctx.arc(cx + 20, cy + h - 5, 18, Math.PI, 0); ctx.fill();
                ctx.fillStyle = '#D3D3D3'; ctx.beginPath(); ctx.arc(cx + 8, cy + h - 12, 6, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'red'; ctx.beginPath(); ctx.arc(cx + 6, cy + h - 12, 3, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(cx + 20, cy + h, 8, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'gray'; ctx.beginPath(); ctx.arc(cx + 20, cy + h, 3, 0, Math.PI*2); ctx.fill();
            } 
            else if (obj.type === 'mech') {
                ctx.fillStyle = '#606060'; ctx.fillRect(cx + 10, cy + 5, 20, 15); 
                ctx.fillStyle = '#2F4F4F'; ctx.fillRect(cx + 8, cy + 20, 8, 10); ctx.fillRect(cx + 24, cy + 20, 8, 10);
                ctx.fillStyle = '#FF4500'; ctx.fillRect(cx + 12, cy + 10, 16, 4);
                ctx.fillStyle = '#FFEA00'; 
                let eyePos = Math.sin(Date.now() / 150) * 5; 
                ctx.beginPath(); ctx.arc(cx + 20 + eyePos, cy + 12, 2, 0, Math.PI*2); ctx.fill();
            } 
            else if (obj.type === 'bee') {
                cy += Math.sin(Date.now() / 150) * 5;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.beginPath(); ctx.ellipse(cx + 20, cy - 8, 12, 6, -Math.PI/6, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(cx + 30, cy - 5, 10, 5, -Math.PI/4, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#0000CD'; ctx.beginPath(); ctx.ellipse(cx + 20, cy + 5, 18, 10, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#FFD700'; ctx.fillRect(cx + 15, cy - 4, 6, 18); ctx.fillRect(cx + 25, cy - 2, 5, 14);
                ctx.fillStyle = 'red'; ctx.beginPath(); ctx.arc(cx + 6, cy + 5, 3, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#555'; ctx.beginPath(); ctx.moveTo(cx + 38, cy + 5); ctx.lineTo(cx + 45, cy + 10); ctx.lineTo(cx + 36, cy + 9); ctx.fill();
            } 
            else if (obj.type === 'drone') {
                cy += Math.sin(Date.now() / 200) * 8; 
                ctx.fillStyle = '#A9A9A9'; ctx.beginPath(); ctx.arc(cx + 20, cy + 15, 15, 0, Math.PI*2); ctx.fill(); 
                ctx.fillStyle = '#4682B4'; ctx.fillRect(cx + 2, cy + 12, 36, 6);
                let coreGlow = Math.abs(Math.sin(Date.now() / 150)) * 2;
                ctx.fillStyle = '#00FFFF'; ctx.beginPath(); ctx.arc(cx + 20, cy + 15, 6 + coreGlow, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(cx + 20, cy + 15, 3, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#00FFFF'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(cx + 20, cy); ctx.lineTo(cx + 20, cy - 10); ctx.stroke(); 
                ctx.beginPath(); ctx.arc(cx + 20, cy - 10, 3, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }

        function updateAndDrawObjects() {
            for (let i = objects.length - 1; i >= 0; i--) {
                let obj = objects[i];
                obj.x -= gameSpeed;

                if (obj.type === 'ring') {
                    ctx.save();
                    let isFirstInSeries = (obj.value === 0);

                    if (isFirstInSeries) {
                        ctx.fillStyle = 'rgba(255, 234, 0, ' + (0.3 + Math.sin(Date.now() / 150) * 0.2) + ')';
                        ctx.beginPath(); ctx.arc(obj.x, obj.y, obj.size + 15, 0, Math.PI * 2); ctx.fill();
                        ctx.shadowColor = '#FFEA00'; ctx.shadowBlur = 15 + Math.sin(Date.now() / 100) * 10;
                    }

                    ctx.strokeStyle = 'gold'; ctx.lineWidth = 6;
                    ctx.beginPath(); ctx.arc(obj.x, obj.y, obj.size, 0, Math.PI * 2); ctx.stroke();
                    ctx.shadowBlur = 0; 
                    ctx.strokeStyle = '#DAA520'; ctx.lineWidth = 2; 
                    ctx.beginPath(); ctx.arc(obj.x, obj.y, obj.size - 3, 0, Math.PI * 2); ctx.stroke();

                    ctx.font = 'bold 36px Arial'; ctx.textBaseline = 'middle'; 
                    
                    if (isFirstInSeries) {
                        ctx.shadowColor = '#FFEA00'; ctx.shadowBlur = 10;
                    }

                    let onesText = obj.value.toString();
                    if (currentTens > 0) {
                        let tensText = currentTens.toString();
                        let tensWidth = ctx.measureText(tensText).width;
                        let onesWidth = ctx.measureText(onesText).width;
                        let totalWidth = tensWidth + onesWidth;
                        let startX = obj.x - (totalWidth / 2);
                        
                        ctx.textAlign = 'left';
                        ctx.fillStyle = '#FFEA00'; ctx.fillText(tensText, startX, obj.y + 2);
                        ctx.fillStyle = '#FF3333'; ctx.fillText(onesText, startX + tensWidth, obj.y + 2);
                    } else {
                        ctx.textAlign = 'center';
                        ctx.fillStyle = '#FF3333'; ctx.fillText(onesText, obj.x, obj.y + 2);
                    }
                    ctx.restore(); 

                    let dist = Math.hypot(player.x - obj.x, player.y - obj.y);
                    if (dist < 45) {
                        currentOnes = obj.value; nextRingValue++; 
                        document.getElementById('onesDisplay').innerText = currentOnes;
                        objects.splice(i, 1);
                    }
                } 
                else {
                    drawObstacle(obj);

                    let hit = false;
                    let obsCenterY = obj.y + 15;
                    if (obj.type === 'bee' || obj.type === 'drone') obsCenterY = obj.y + 10; 
                    
                    let dist = Math.hypot(player.x - (obj.x + 20), player.y - obsCenterY);
                    
                    if (dist < 35 && !player.isHurt) { hit = true; player.dy = -6; }

                    if (hit) {
                        player.isHurt = true; player.hurtTimer = 60; 
                        if (currentOnes > 0) {
                            currentOnes--; nextRingValue--;
                            document.getElementById('onesDisplay').innerText = currentOnes;
                            objects.forEach(o => { if (o.type === 'ring') o.value = nextRingValue; });
                        }
                    }
                }

                if (obj && obj.x < -60) objects.splice(i, 1);
            }
        }

        function drawOverlayMessage() {
            if (showMessage) {
                messageTimer--;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(0, 0, canvas.width, 80);
                ctx.fillStyle = '#FFEA00'; ctx.font = 'bold 30px Arial'; ctx.textAlign = 'center';
                ctx.fillText("🌟 10 røde ringe blev til 1 guld ring! 🌟", canvas.width / 2, 50);
                if (messageTimer <= 0) showMessage = false;
            }
        }

        function update() {
            if (player.isHurt) {
                player.hurtTimer--;
                if (player.hurtTimer <= 0) player.isHurt = false;
            }

            if (gameState === 'SONIC_CHEER' && (currentTens === 5 || currentTens === 10)) {
                if (Math.random() < 0.1) {
                    createFirework(50 + Math.random() * 700, 50 + Math.random() * 150);
                }
            }

            if (gameState === 'PLAYING') {
                player.dy += player.gravity; player.y += player.dy;
                if (player.x < 50) player.x += 2;
                if (player.x < 150 && !player.isHurt) player.x += 1;

                if (player.y >= 300) { player.y = 300; player.dy = 0; player.isJumping = false; }

                spawnTimer++;
                let spawnThreshold = baseSpeed >= 10 ? 60 : 80;

                if (spawnTimer > spawnThreshold) { 
                    let hasRing = objects.some(o => o.type === 'ring');
                    if (!hasRing) {
                        if (nextRingValue > 9) {
                            triggerTailsTransition(); 
                        } else if (!lastSpawnWasObstacle && Math.random() < obstacleChance) {
                            let type = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
                            let yPos = (type === 'bee' || type === 'drone') ? 250 : 290; 
                            let w = 40; let h = type === 'spikes' ? 30 : 30;
                            
                            objects.push({ type: type, x: 850, y: yPos, width: w, height: h });
                            lastSpawnWasObstacle = true;
                        } else {
                            objects.push({ type: 'ring', x: 850, y: 250 - Math.random() * 80, size: 30, value: nextRingValue });
                            lastSpawnWasObstacle = false;
                        }
                    }
                    spawnTimer = 0;
                }
            } 
            else if (gameState === 'TAILS_IN') {
                tails.x += (tails.targetX - tails.x) * 0.05;
                tails.y += (tails.targetY - tails.y) * 0.05;
                
                player.dy += player.gravity; player.y += player.dy;
                if (player.y >= 300) { player.y = 300; player.dy = 0; player.isJumping = false; }

                if (Math.abs(tails.x - tails.targetX) < 5 && Math.abs(tails.y - tails.targetY) < 5) {
                    gameState = 'TAILS_DROP';
                }
                
                bigRing.x = tails.x;
                bigRing.y = tails.y + 35;
            } 
            else if (gameState === 'TAILS_DROP') {
                bigRing.y += 6;
                if (bigRing.y >= player.y) {
                    sonicHasAura = true;
                    loopVisible = true;
                    bigRing.active = false; 
                    
                    gameState = 'SONIC_LOOP';
                    loopObj.phase = 1; loopObj.angle = Math.PI / 2;
                }
            }
            else if (gameState === 'SONIC_LOOP') {
                tails.x += 8; tails.y -= 5;
                
                gameSpeed = 16; 

                if (loopObj.phase === 1) {
                    player.x += 10;
                    if (player.x >= 400) { player.x = 400; loopObj.phase = 2; }
                } else if (loopObj.phase === 2) {
                    loopObj.angle -= 0.15; 
                    player.x = 400 + 100 * Math.cos(loopObj.angle);
                    player.y = 200 + 100 * Math.sin(loopObj.angle);
                    
                    if (loopObj.angle <= -3 * Math.PI / 2) {
                        loopObj.phase = 3; player.y = 300; 
                    }
                } else if (loopObj.phase === 3) {
                    player.x += 15;
                    
                    if (player.x > 900) {
                        gameState = 'SONIC_CHEER'; 
                        gameSpeed = baseSpeed; 
                        
                        player.x = 850; 
                        player.y = 300;
                        player.dy = -15; 
                        
                        sonicHasAura = false;
                        loopVisible = false; 
                        
                        bigRing.active = true;
                        bigRing.animatingToUI = false;
                        bigRing.ringScale = 1;
                        bigRing.textScale = 1;
                        bigRing.ringAlpha = 1;
                        
                        currentTens++;
                        currentOnes = 0;
                        nextRingValue = 0;
                        
                        let tensEl = document.getElementById('tensDisplay');
                        tensEl.innerText = currentTens;
                        tensEl.classList.remove('pop-animation');
                        void tensEl.offsetWidth; 
                        tensEl.classList.add('pop-animation');
                        document.getElementById('onesDisplay').innerText = "0";
                        
                        showMessage = true; messageTimer = 150; 
                    }
                }
            }
            else if (gameState === 'SONIC_CHEER') {
                if (player.x > 150) {
                    player.x -= 4; 
                    
                    player.dy += player.gravity;
                    player.y += player.dy;
                    
                    if (player.y >= 300) {
                        player.y = 300;
                        if (player.x > 150) {
                            player.dy = -12; 
                        }
                    }
                    
                    bigRing.x = player.x;
                    bigRing.y = player.y - 50; 
                } else {
                    player.x = 150;
                    
                    if (player.y < 300) {
                        player.dy += player.gravity;
                        player.y += player.dy;
                        if (player.y >= 300) {
                            player.y = 300;
                            if ((currentTens === 5 || currentTens === 10) && messageTimer > 0) {
                                player.dy = -10; 
                            }
                        }
                        bigRing.x = player.x;
                        bigRing.y = player.y - 50;
                    } else {
                        if ((currentTens === 5 || currentTens === 10) && messageTimer > 0) {
                            player.dy = -10; 
                        }

                        if (!bigRing.animatingToUI) {
                            let uiTargetCol = currentTens - 1;
                            // Sæt targetX til præcis den grå rings plads!
                            bigRing.targetX = 50 + (uiTargetCol * 76); 
                            bigRing.targetY = 40;
                            bigRing.animatingToUI = true;
                        }
                    }
                }

                if (bigRing.animatingToUI) {
                    bigRing.x += (bigRing.targetX - bigRing.x) * 0.08;
                    bigRing.y += (bigRing.targetY - bigRing.y) * 0.08;

                    // Matcher nu præcist ned til radius 28 størrelsen
                    if (bigRing.ringScale > 0.8) bigRing.ringScale -= 0.02;
                    if (bigRing.textScale > 0.73) bigRing.textScale -= 0.015;

                    let dist = Math.hypot(bigRing.targetX - bigRing.x, bigRing.targetY - bigRing.y);
                    if (dist < 15) {
                        bigRing.ringAlpha -= 0.1; 
                        if (bigRing.ringAlpha <= 0) {
                            bigRing.active = false;
                            bigRing.animatingToUI = false;
                            highestRevealedTen = currentTens; 
                        }
                    }
                }

                if (!bigRing.animatingToUI && !bigRing.active) {
                    if ((currentTens === 5 || currentTens === 10) && messageTimer > 0) {
                        // Fortsæt festen indtil timer udløber
                    } else {
                        gameState = 'PLAYING';
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            updateAndDrawObjects();
            
            drawTails();
            drawBigRing();
            drawPlayer();
            
            updateAndDrawFireworks();
            drawOverlayMessage();
        }

        function gameLoop() {
            update(); draw(); requestAnimationFrame(gameLoop);
        }

        function jump(e) {
            if (e.target.tagName.toLowerCase() === 'a' || e.target.tagName.toLowerCase() === 'select') return;
            if (e) e.preventDefault(); 
            if (gameState === 'PLAYING' && !player.isJumping && !player.isHurt) {
                player.dy = player.jumpPower; player.isJumping = true;
            }
        }
        canvas.addEventListener('mousedown', jump);
        canvas.addEventListener('touchstart', jump, {passive: false});

        gameLoop();
    </script>
</body>
</html>
