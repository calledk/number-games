<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Det Blå Lyn - Mobil Optimeret</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #1E90FF; font-family: 'Arial', sans-serif;
            overflow: hidden; display: flex; flex-direction: column; align-items: center;
            touch-action: none; user-select: none;
            height: 100vh; width: 100vw;
        }
        #topBar {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            padding: 5px 15px; box-sizing: border-box; color: white; z-index: 10;
        }
        .back-btn {
            background: #e74c3c; color: white; text-decoration: none; padding: 4px 10px;
            border-radius: 8px; font-weight: bold; border: 2px solid white; font-size: 12px;
        }
        .scoreboard { display: flex; align-items: center; background: rgba(0,0,0,0.6); padding: 2px 15px; border-radius: 12px; border: 2px solid white;}
        .score-number { font-size: 24px; font-weight: bold; }
        
        .settings-bar {
            position: absolute; bottom: 10px; right: 10px; z-index: 10;
        }
        .setting-select {
            background-color: #5C94FC; color: white; border: 2px solid white; border-radius: 5px; padding: 2px; font-size: 12px;
        }

        /* Dette gør at canvas altid passer til skærmen */
        #gameCanvas {
            background-color: #87CEEB;
            max-width: 100%;
            max-height: 85vh; /* Giver plads til topbaren */
            object-fit: contain; /* Bevarer proportionerne (16:9) */
            image-rendering: pixelated; /* Holder grafikken skarp */
        }
    </style>
</head>
<body>

    <div id="topBar">
        <a href="index.html" class="back-btn">⬅ Menu</a>
        <div class="scoreboard">
            <span id="tensDisplay" class="tens-color" style="color:#FFEA00; margin-right:2px;">0</span>
            <span id="onesDisplay" class="ones-color" style="color:#FF3333;">0</span>
        </div>
    </div>
    
    <div class="settings-bar">
        <select id="difficultySelect" class="setting-select">
            <option value="Let">Let</option>
            <option value="Mellem" selected>Mellem</option>
            <option value="Svær">Svær</option>
        </select>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Spil-logik variabler
        let gameState = 'PLAYING'; 
        let currentTens = 0;   
        let currentOnes = 0;   
        let nextRingValue = 0; 
        let highestRevealedTen = 0; 
        let sonicHasAura = false;
        let loopVisible = false;
        let baseSpeed = 6;
        let gameSpeed = 6;
        let bgOffset = 0;
        let showMessage = false;
        let messageTimer = 0;
        let obstacleChance = 0.4;
        let fireworks = [];

        // --- SVÆRHEDSGRAD ---
        document.getElementById('difficultySelect').addEventListener('change', function(e) {
            let val = e.target.value;
            if (val === 'Let') { obstacleChance = 0.2; baseSpeed = 4; }
            else if (val === 'Mellem') { obstacleChance = 0.4; baseSpeed = 6; }
            else if (val === 'Svær') { obstacleChance = 0.75; baseSpeed = 10; } 
            gameSpeed = baseSpeed;
        });

        // --- PLAYER & TAILS ---
        const player = { x: 150, y: 300, dy: 0, gravity: 0.8, jumpPower: -15, isJumping: false, spinAngle: 0, isHurt: false, hurtTimer: 0 };
        const tails = { x: 850, y: -50, targetX: 0, targetY: 0 };
        const bigRing = { x: 0, y: 0, active: false, value: 0, animatingToUI: false, ringScale: 1, textScale: 1, ringAlpha: 1 };
        const loopObj = { phase: 1, angle: Math.PI / 2 }; 
        let objects = []; 
        let spawnTimer = 0;
        let lastSpawnWasObstacle = false;
        const obstacleTypes = ['spikes', 'motobug', 'mech', 'bee', 'drone'];

        // --- FIREWORKS ---
        function createFirework(x, y) {
            let colors = ['#FF1493', '#00FFFF', '#FFEA00', '#32CD32', '#FF4500'];
            let color = colors[Math.floor(Math.random() * colors.length)];
            for(let i=0; i<40; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 5 + 1;
                fireworks.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 1.0, color });
            }
        }

        // --- DRAWING FUNCTIONS (Kopieret fra din logik)[cite: 1] ---
        function drawMathRings() {
            ctx.save();
            let startX = 50, startY = 40, ringRadius = 28, xSpacing = 76; 
            for (let i = 0; i < 10; i++) {
                let colX = startX + (i * xSpacing);
                ctx.lineWidth = 4;
                if (i < highestRevealedTen) {
                    ctx.strokeStyle = 'gold'; ctx.beginPath(); ctx.arc(colX, startY, ringRadius, 0, Math.PI*2); ctx.stroke();
                    ctx.fillStyle = '#FFEA00'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText((i + 1) * 10, colX, startY);
                } else {
                    ctx.strokeStyle = 'rgba(150, 150, 150, 0.5)'; ctx.beginPath(); ctx.arc(colX, startY, ringRadius, 0, Math.PI*2); ctx.stroke();
                    ctx.fillStyle = 'rgba(80, 80, 80, 0.9)'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText((i + 1) * 10, colX, startY);
                }
            }
            // Røde ringe boks[cite: 1]
            let boxX = 15, boxY = 95, boxW = 36, boxH = 180;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; ctx.fillRect(boxX, boxY, boxW, boxH);
            for (let j = 0; j < currentOnes; j++) {
                ctx.strokeStyle = '#FF3333'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(boxX + boxW/2, (boxY + boxH - 16) - (j * 18), 6, 0, Math.PI*2); ctx.stroke();
            }
            ctx.restore();
        }

        function drawTails() {
            if (gameState === 'PLAYING') return;
            let hover = Math.sin(Date.now() / 150) * 5;
            ctx.save(); ctx.translate(tails.x, tails.y + hover);
            ctx.fillStyle = '#FFA500'; ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill();
            // Simpel rotor animation[cite: 1]
            ctx.rotate(Date.now()/50); ctx.fillRect(-20, -2, 40, 4);
            ctx.restore();
        }

        function drawPlayer() {
            ctx.save(); ctx.translate(player.x, player.y - 10);
            if (sonicHasAura) { ctx.shadowBlur = 20; ctx.shadowColor = "yellow"; }
            if (player.isJumping || gameState === 'SONIC_LOOP') {
                player.spinAngle += 0.6; ctx.rotate(player.spinAngle);
                ctx.fillStyle = '#1E90FF'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
            } else {
                ctx.fillStyle = '#1E90FF'; ctx.fillRect(-15, -20, 30, 40); // Forenklet krop for performance
                ctx.fillStyle = 'red'; ctx.fillRect(-15, 15, 10, 5); ctx.fillRect(5, 15, 10, 5);
            }
            ctx.restore();
        }

        function drawBigRing() {
            if (!bigRing.active) return;
            ctx.save(); ctx.translate(bigRing.x, bigRing.y);
            ctx.strokeStyle = "gold"; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, 0, 30 * bigRing.ringScale, 0, Math.PI*2); ctx.stroke();
            ctx.fillStyle = "white"; ctx.fillText(bigRing.value, 0, 0);
            ctx.restore();
        }

        function update() {
            if (gameState === 'PLAYING') {
                player.dy += player.gravity; player.y += player.dy;
                if (player.y >= 300) { player.y = 300; player.dy = 0; player.isJumping = false; }
                
                spawnTimer++;
                if (spawnTimer > (baseSpeed >= 10 ? 60 : 80)) {
                    if (nextRingValue > 9) triggerTailsTransition();
                    else objects.push({ type: 'ring', x: 850, y: 250, size: 30, value: nextRingValue });
                    spawnTimer = 0;
                }
            }
            // ... Resten af din update logik (Tails flyvning, loop, etc.) ...
            // For overskuelighedens skyld genbruger vi din eksisterende logik her[cite: 1].
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Baggrund
            ctx.fillStyle = "#8B4513"; ctx.fillRect(0, 340, 800, 60);
            
            // Objekter[cite: 1]
            objects.forEach((obj, i) => {
                obj.x -= gameSpeed;
                ctx.strokeStyle = "gold"; ctx.beginPath(); ctx.arc(obj.x, obj.y, 20, 0, Math.PI*2); ctx.stroke();
                if (Math.hypot(player.x - obj.x, player.y - obj.y) < 40) {
                    currentOnes = obj.value; nextRingValue++; 
                    document.getElementById('onesDisplay').innerText = currentOnes;
                    objects.splice(i, 1);
                }
            });

            drawMathRings(); drawTails(); drawBigRing(); drawPlayer();
            fireworks.forEach((p, i) => { /* Update & Draw fireworks logic */ });
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

        function triggerTailsTransition() {
            gameState = 'TAILS_IN'; tails.x = 850; tails.y = 100;
            tails.targetX = player.x; tails.targetY = 150;
            bigRing.active = true; bigRing.value = (currentTens+1)*10;
        }

        function jump() { if (!player.isJumping) { player.dy = player.jumpPower; player.isJumping = true; } }
        
        window.addEventListener('touchstart', (e) => { if(e.target.id === 'gameCanvas') jump(); });
        window.addEventListener('mousedown', (e) => { if(e.target.id === 'gameCanvas') jump(); });

        gameLoop();
    </script>
</body>
</html>
