<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <!-- Tilføjet viewport-fit=cover for at fjerne hvide kanter på moderne telefoner -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Matematik Kongeriget</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #87CEEB;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Gør plads til UI øverst */
            height: 100vh;
            width: 100vw;
            touch-action: none; /* Forhindrer uønsket zoom og scroll */
            user-select: none;
            -webkit-user-select: none;
        }
        #gameCanvas {
            background-color: #5C94FC;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            margin-top: 5px;
            border-radius: 10px;
            width: 100%;
            max-width: 800px;
            max-height: 70vh; /* Sikrer at hele spillet kan ses uden at scrolle */
            object-fit: contain; /* Bevarer 16:9 formatet */
            touch-action: none; 
        }
        #ui {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 0 #000;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 { margin: 2px 0; font-size: clamp(16px, 4vw, 22px); }
        p { margin: 2px 0; font-size: clamp(12px, 3vw, 16px); }
        .progress { color: #F8E000; font-weight: bold; }
        
        #answersSelect {
            font-size: 16px;
            font-weight: bold;
            background-color: #5C94FC;
            color: white;
            border: 2px solid white;
            border-radius: 5px;
            padding: 2px 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Matematik Kongeriget</h1>
        <p>Niveau: <span id="levelDisplay">1</span> | Stjerner: <span id="scoreDisplay">0</span></p>
        <p class="progress">
            Fremskridt: <span id="progressDisplay">0</span> / 
            <select id="answersSelect">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
            </select>
        </p>
        <p id="instruction" style="font-weight:bold;">Tryk på den rigtige talblok!</p>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Spil-tilstande
        let gameState = 'PLAYING'; 
        let level = 1;
        let score = 0;
        let correctInLevel = 0;
        let answersNeeded = 10; 
        let targetAnswer = 0;
        let equation = "";

        // Dropdown menu logik
        document.getElementById('answersSelect').addEventListener('change', function(e) {
            answersNeeded = parseInt(e.target.value);
            if (correctInLevel >= answersNeeded && gameState === 'PLAYING') {
                triggerLevelComplete();
            }
        });

        // Objekter
        const player = { x: 50, y: 290, width: 40, height: 50, speed: 6, state: 'IDLE', targetX: 50, targetBlock: null, jumpTimer: 0, interactiveJumpTimer: 0, scale: 1.0, oldScale: 1.0, targetScale: 1.0, growTimer: 0, rotation: 0, knockbackY: 0 };
        const friend = { x: 800, y: 290, width: 40, height: 50, speed: 7, state: 'HIDDEN', jumpTimer: 0, scale: 1.0, rotation: 0 };
        const mushroom = { x: 0, y: 0, state: 'inactive', startY: 0 };
        const shell = { x: 850, y: 310, active: false };
        const cloud = { x: -150, y: 50, active: false, timer: 0, speed: 0.8, spawned: false, state: 'flying', rainTimer: 0 };
        let blocks = [];

        function getMaxNumber(lvl) {
            let relativeLvl = lvl > 5 ? lvl - 5 : lvl;
            if (relativeLvl === 1) return 10;
            if (relativeLvl === 2) return 20;
            if (relativeLvl === 3) return 50;
            return 100;
        }

        function generatePuzzle() {
            player.x = 50; player.y = 290; player.rotation = 0; player.state = 'IDLE';
            mushroom.state = 'inactive'; shell.active = false;
            cloud.active = Math.random() > 0.5; cloud.spawned = false; cloud.x = -150; cloud.state = 'flying';

            let maxNum = getMaxNumber(level);
            let isMath = level > 5;
            
            if (!isMath) {
                targetAnswer = Math.floor(Math.random() * (maxNum - 4)) + 2; 
                equation = `${targetAnswer - 2}, ${targetAnswer - 1},  ? , ${targetAnswer + 1}`;
            } else {
                targetAnswer = Math.floor(Math.random() * (maxNum + 1));
                let num1 = Math.floor(Math.random() * (targetAnswer + 1));
                equation = `${num1} + ${targetAnswer - num1} = ?`;
            }

            let answers = [targetAnswer];
            while (answers.length < 3) {
                let wrong = targetAnswer + (Math.floor(Math.random() * 9) - 4);
                if (wrong >= 0 && !answers.includes(wrong) && wrong !== targetAnswer) answers.push(wrong);
            }
            answers.sort(() => Math.random() - 0.5);

            blocks = [];
            for (let i = 0; i < 3; i++) {
                blocks.push({ x: 250 + (i * 180), y: 180, width: 70, height: 70, value: answers[i], color: '#F8E000' });
            }
        }

        // Tegnefunktioner (Mario-stil)
        function drawCharacter(char, hatColor, shirtColor) {
            if (char.state === 'HIDDEN') return;
            ctx.save();
            ctx.translate(char.x + 20, char.y + 50);
            ctx.rotate(char.rotation);
            ctx.scale(char.scale, char.scale);
            ctx.fillStyle = hatColor; ctx.fillRect(-16, -50, 32, 12);
            ctx.fillStyle = shirtColor; ctx.fillRect(-16, -24, 32, 16);
            ctx.fillStyle = '#0043A6'; ctx.fillRect(-12, -16, 24, 16);
            ctx.restore();
        }

        function drawCloud(x, y, state, rainTimer) {
            if (state === 'raining') {
                ctx.strokeStyle = '#1E90FF'; ctx.beginPath();
                for(let i = 0; i < 5; i++) { ctx.moveTo(x + i*10, y + 20); ctx.lineTo(x + i*10 - 5, y + 40); }
                ctx.stroke();
            }
            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI*2); ctx.arc(x+25, y-10, 30, 0, Math.PI*2); ctx.arc(x+50, y, 25, 0, Math.PI*2); ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#A0522D'; ctx.fillRect(0, 340, canvas.width, 60);
            ctx.fillStyle = '#32CD32'; ctx.fillRect(0, 340, canvas.width, 10);

            if (cloud.spawned) drawCloud(cloud.x, cloud.y, cloud.state, cloud.rainTimer);
            
            if (gameState === 'PLAYING') {
                ctx.fillStyle = 'white'; ctx.font = 'bold 30px Arial'; ctx.textAlign = 'center';
                ctx.fillText(equation, canvas.width/2, 60);
                blocks.forEach(block => {
                    ctx.fillStyle = block.color; ctx.fillRect(block.x, block.y, block.width, block.height);
                    ctx.fillStyle = 'black'; ctx.font = 'bold 30px Arial';
                    ctx.fillText(block.value, block.x + block.width/2, block.y + 45);
                });
            }

            if (shell.active) { ctx.fillStyle = 'red'; ctx.fillRect(shell.x, shell.y, 40, 30); }
            drawCharacter(player, '#E52521', '#E52521'); 
            drawCharacter(friend, '#43B047', '#43B047'); 
        }

        function update() {
            // Sky fysik
            if (cloud.spawned) {
                if (cloud.state === 'flying') cloud.x += cloud.speed;
                else { cloud.rainTimer++; if(cloud.rainTimer > 60) cloud.state = 'flying'; }
                if (cloud.x > 900) { cloud.spawned = false; cloud.timer = 0; }
            }

            if (gameState === 'PLAYING') {
                if (player.state === 'WALKING') {
                    player.x += (player.x < player.targetX) ? player.speed : -player.speed;
                    if (Math.abs(player.x - player.targetX) <= player.speed) player.state = 'JUMPING';
                } else if (player.state === 'JUMPING') {
                    player.jumpTimer++;
                    player.y = (player.jumpTimer < 12) ? player.y - 8 : player.y + 8;
                    if (player.jumpTimer >= 24) { player.y = 290; checkAnswer(player.targetBlock.value); }
                }
            } 
            else if (gameState === 'SHELL_IN') {
                shell.x -= 12; if (shell.x < -50) { generatePuzzle(); gameState = 'PLAYING'; }
            }
        }

        function checkAnswer(value) {
            if (value === targetAnswer) {
                score++; correctInLevel++;
                document.getElementById('scoreDisplay').innerText = score;
                document.getElementById('progressDisplay').innerText = correctInLevel;
                if (correctInLevel >= answersNeeded) triggerLevelComplete();
                else generatePuzzle();
            } else {
                shell.x = 850; shell.active = true; gameState = 'SHELL_IN'; 
            }
        }

        function triggerLevelComplete() {
            gameState = 'LEVEL_COMPLETE'; level++; 
            document.getElementById('levelDisplay').innerText = level;
            setTimeout(() => { correctInLevel = 0; document.getElementById('progressDisplay').innerText = 0; generatePuzzle(); gameState = 'PLAYING'; }, 2000);
        }

        function handleInput(evt) {
            if (evt.target.id === 'answersSelect') return;
            evt.preventDefault();
            
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            let clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;

            const clickX = (clientX - rect.left) * scaleX;
            const clickY = (clientY - rect.top) * scaleY;

            blocks.forEach(block => {
                if (clickX > block.x && clickX < block.x + block.width && gameState === 'PLAYING') {
                    player.targetBlock = block;
                    player.targetX = block.x + 15;
                    player.state = 'WALKING';
                }
            });
        }

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', handleInput, {passive: false});

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        generatePuzzle();
        gameLoop();
    </script>
</body>
</html>
